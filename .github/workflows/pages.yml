name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ornamente erzeugen
        run: python3 tools/ornaments.py

      - name: Seiten bauen
        run: node build.mjs

      - name: Prüfen, dass dist/ aktuell eingecheckt ist
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ weicht vom Build ab — bitte 'node build.mjs' ausführen und das Ergebnis committen."
            git diff --stat -- dist
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
